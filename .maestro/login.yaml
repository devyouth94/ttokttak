appId: com.youngzin.ttokttak
---
- stopApp
- openLink: "ttokttak://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- tapOn:
    text: "Open|열기"
    optional: true
- tapOn:
    text: "Continue|계속"
    optional: true
- tapOn:
    text: "Continue|계속"
    optional: true
- tapOn:
    text: "Got it|확인"
    optional: true
- tapOn:
    text: "Close|닫기"
    optional: true
- extendedWaitUntil:
    visible: "로컬 테스트 로그인|Local test sign-in|홈|Home"
    timeout: 120000
- openLink: "ttokttak://local-login"
- extendedWaitUntil:
    visible:
      id: "local-email"
    timeout: 30000
- tapOn:
    id: "local-email"
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: "local-password"
- inputText: ${MAESTRO_PASSWORD}
- pressKey: Enter
- runFlow:
    when:
      visible: "^지금 안 함$|^Not Now$"
    commands:
      - tapOn: "^지금 안 함$|^Not Now$"
- runFlow:
    when:
      visible: "^허용하기$|^Allow$"
    commands:
      - tapOn: "^허용하기$|^Allow$"
      - tapOn:
          text: "^허용$|^Allow$"
          optional: true
- extendedWaitUntil:
    visible: "홈|Home"
    timeout: 30000
