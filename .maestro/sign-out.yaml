appId: com.youngzin.ttokttak
---
- tapOn: "설정|Settings"
- scrollUntilVisible:
    element:
      id: "settings-sign-out"
    direction: DOWN
- swipe:
    start: "90%,70%"
    end: "90%,40%"
    duration: 300
- tapOn:
    id: "settings-sign-out"
    point: "50%,20%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "로컬 테스트 로그인|Local test sign-in"
    timeout: 30000
